name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  lib-vt:
    name: lib-vt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (release)
        run: cargo test --release --no-default-features --features lib-vt --lib
      - name: Test terminal with debug assertions
        if: matrix.os == 'ubuntu-latest'
        run: "cargo test --no-default-features --features lib-vt --lib terminal::"
      - name: Build the static library
        run: cargo rustc --release --no-default-features --features lib-vt --lib --crate-type staticlib
