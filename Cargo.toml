[package]
name = "ghostty"
version = "1.4.1"
edition = "2021"
description = "Rust port of the Ghostty terminal emulator"
license = "MIT"
autobins = false

# Each checkout (including agent worktrees nested under .claude/) is its own workspace root.
[workspace]

[lib]
name = "ghostty"
path = "src/root.rs"

[[bin]]
name = "ghostty"
path = "src/main.rs"
required-features = ["app"]

[[bin]]
name = "ghostty-bench"
path = "src/bin/ghostty-bench.rs"
required-features = ["app"]

[[bin]]
name = "ghostty-build-data"
path = "src/bin/ghostty-build-data.rs"
required-features = ["app"]

[[bin]]
name = "ghostty-gen"
path = "src/bin/ghostty-gen.rs"
required-features = ["app"]

[[bin]]
name = "mdgen_ghostty_1"
path = "src/build/mdgen/main_ghostty_1.rs"
required-features = ["docs"]

[[bin]]
name = "mdgen_ghostty_5"
path = "src/build/mdgen/main_ghostty_5.rs"
required-features = ["docs"]

[[bin]]
name = "webgen_actions"
path = "src/build/webgen/main_actions.rs"
required-features = ["docs"]

[[bin]]
name = "webgen_commands"
path = "src/build/webgen/main_commands.rs"
required-features = ["docs"]

[[bin]]
name = "webgen_config"
path = "src/build/webgen/main_config.rs"
required-features = ["docs"]

[features]
# The GTK application runtime is the default on Linux; build the
# runtime-less helper CLI (and the stand-in apprt) with
# `--no-default-features --features app`.
default = ["app", "gtk"]
# The Ghostty application: apprt, renderer, fonts, config, CLI, termio, the
# libghostty embedding C API (`ghostty_app_*`, `ghostty_surface_*`, ...) and
# the system C libraries they link (freetype, harfbuzz, fontconfig,
# oniguruma, EGL/GL).
app = [
    "dep:cc",
    "dep:crossterm",
    "dep:flate2",
    "dep:half",
    "dep:naga",
    "dep:pkg-config",
    "dep:png",
    "dep:tiny-skia",
    "dep:unicode-segmentation",
    "dep:unicode-width",
    "dep:zune-jpeg",
]
# libghostty-vt: the terminal with the lib-vt build options (C ABI, no
# Oniguruma or tmux control mode, the libghostty-vt version) and its
# `ghostty_*` C API (`include/ghostty/vt.h`). With
# `--no-default-features --features lib-vt` only the terminal and what it
# reaches is compiled, with no system C libraries, so the crate can be used
# as a plain Rust dependency for the C API. See `tools/build_lib_vt.sh`.
lib-vt = []
# The man page (`mdgen_*`) and website reference (`webgen_*`) generators
# (Zig: `-Demit-docs` / `-Demit-webdata`).
docs = ["app"]
inspector = ["app"]
# Crash reporting via the Sentry native SDK (links the system `sentry` C library).
sentry = ["app"]
gtk = [
    "app",
    "dep:bitflags",
    "dep:gdk4-wayland",
    "dep:gdk4-x11",
    "dep:gio",
    "dep:glib",
    "dep:gtk4",
    "dep:libadwaita",
    "dep:wayland-backend",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-protocols-plasma",
    "dep:wayland-scanner",
    "dep:x11",
]
# gtk4-layer-shell support for the GTK quick terminal. Needs the system
# `gtk4-layer-shell-0` library, so it is not part of `gtk` itself.
gtk-layer-shell = ["gtk", "dep:gtk4-layer-shell"]

[dependencies]
base64 = "0.22"
# Used by the wayland-scanner generated vicinae-hotkey protocol code.
bitflags = { version = "2", optional = true }
crossterm = { version = "0.29", optional = true }
flate2 = { version = "1", optional = true }
gdk4-wayland = { version = "0.10", optional = true, features = ["v4_12", "wayland_crate"] }
gdk4-x11 = { version = "0.10", optional = true, features = ["v4_4", "xlib"] }
getrandom = "0.3"
gio = { version = "0.21", optional = true }
glib = { version = "0.21", optional = true, features = ["v2_74"] }
gtk4 = { version = "0.10", optional = true, features = ["v4_14"] }
gtk4-layer-shell = { version = "0.7", optional = true }
half = { version = "2", optional = true }
indexmap = "2"
libadwaita = { version = "0.8", optional = true, features = ["v1_5"] }
libc = "0.2"
log = "0.4"
memchr = "2"
miniz_oxide = "0.8"
naga = { version = "30", features = ["glsl-in", "glsl-out", "msl-out", "spv-in", "spv-out"], optional = true }
png = { version = "0.18", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"], optional = true }
unicode-segmentation = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }
wayland-backend = { version = "0.3", optional = true, features = ["client_system"] }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", optional = true, features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", optional = true, features = ["client"] }
wayland-scanner = { version = "0.31", optional = true }
x11 = { version = "2", optional = true, features = ["xlib"] }
zune-jpeg = { version = "0.5", optional = true }

[dev-dependencies]
png = "0.18"

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
